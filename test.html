<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест подключения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>🔧 Тест подключения к API</h1>
    
    <div>
        <button onclick="testHealth()">Проверить Health</button>
        <button onclick="testStats()">Проверить Stats</button>
        <button onclick="testClients()">Проверить Clients</button>
        <button onclick="openMain()">Открыть главную страницу</button>
    </div>

    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:3000';
        
        function showResult(title, data, isError = false) {
            const resultDiv = document.getElementById('result');
            const className = isError ? 'error' : 'success';
            resultDiv.innerHTML = `
                <h3 class="${className}">${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        async function testHealth() {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                showResult('✅ Health Check - OK', data);
            } catch (error) {
                showResult('❌ Health Check - Error', { error: error.message }, true);
            }
        }

        async function testStats() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();
                showResult('✅ Stats - OK', data);
            } catch (error) {
                showResult('❌ Stats - Error', { error: error.message }, true);
            }
        }

        async function testClients() {
            try {
                const response = await fetch(`${API_URL}/api/clients`);
                const data = await response.json();
                showResult('✅ Clients - OK', data);
            } catch (error) {
                showResult('❌ Clients - Error', { error: error.message }, true);
            }
        }

        function openMain() {
            window.location.href = `${API_URL}`;
        }

        // Автоматическая проверка при загрузке
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
