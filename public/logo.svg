<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Shield background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c94444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b2525;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer shield -->
  <path d="M250 10 L450 70 L450 200 Q450 320 250 390 Q50 320 50 200 L50 70 Z"
        fill="url(#shieldGrad)" stroke="#fff" stroke-width="8"/>

  <!-- Inner shield -->
  <path d="M250 30 L420 80 L420 200 Q420 300 250 360 Q80 300 80 200 L80 80 Z"
        fill="none" stroke="#fff" stroke-width="6"/>

  <!-- Circuit lines left -->
  <g stroke="#fff" stroke-width="3" fill="none">
    <line x1="50" y1="150" x2="110" y2="150"/>
    <line x1="50" y1="170" x2="110" y2="170"/>
    <line x1="50" y1="190" x2="110" y2="190"/>
    <circle cx="115" cy="150" r="3" fill="#fff"/>
    <circle cx="115" cy="170" r="3" fill="#fff"/>
    <circle cx="115" cy="190" r="3" fill="#fff"/>
  </g>

  <!-- Circuit lines right -->
  <g stroke="#fff" stroke-width="3" fill="none">
    <line x1="450" y1="150" x2="390" y2="150"/>
    <line x1="450" y1="170" x2="390" y2="170"/>
    <line x1="450" y1="190" x2="390" y2="190"/>
    <circle cx="385" cy="150" r="3" fill="#fff"/>
    <circle cx="385" cy="170" r="3" fill="#fff"/>
    <circle cx="385" cy="190" r="3" fill="#fff"/>
  </g>

  <!-- IT text box -->
  <rect x="140" y="110" width="220" height="90"
        rx="10" fill="none" stroke="#fff" stroke-width="6"/>

  <!-- IT text -->
  <text x="250" y="175" font-family="Arial, sans-serif" font-size="80"
        font-weight="bold" fill="#fff" text-anchor="middle">IT</text>

  <!-- Ribbon left -->
  <path d="M50 170 L10 170 L30 200 L10 230 L50 230 Z"
        fill="#8b2525" stroke="#721c1c" stroke-width="2"/>

  <!-- Ribbon right -->
  <path d="M450 170 L490 170 L470 200 L490 230 L450 230 Z"
        fill="#8b2525" stroke="#721c1c" stroke-width="2"/>

  <!-- SERVICE banner -->
  <rect x="100" y="220" width="300" height="60"
        fill="#c94444" stroke="#fff" stroke-width="4"/>

  <!-- SERVICE text -->
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#fff" text-anchor="middle">SERVICE</text>
</svg>
