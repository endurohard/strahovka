version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: strahovka_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-strahovka}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"  # Только localhost
    networks:
      - strahovka_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strahovka_app_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-strahovka}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EXCEL_FILE_PATH: /data/clients.xlsx
      API_PORT: ${API_PORT:-10804}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./data:/data
      - whatsapp_session:/app/.wwebjs_auth
      - whatsapp_cache:/app/wwebjs_cache
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-10804}:10804"
    networks:
      - strahovka_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:10804/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: strahovka_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - strahovka_network
    profiles:
      - with-nginx

  # Backup service (optional)
  backup:
    image: postgres:15-alpine
    container_name: strahovka_backup
    restart: "no"
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-strahovka}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - strahovka_network
    profiles:
      - backup
    entrypoint: ["/backup.sh"]

volumes:
  postgres_data:
    driver: local
  whatsapp_session:
    driver: local
  whatsapp_cache:
    driver: local
  uploads:
    driver: local
  nginx_logs:
    driver: local

networks:
  strahovka_network:
    driver: bridge
